<!doctype html>
<html lang="de-CH">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARO HMI Generator</title>
<style>
  * { box-sizing: border-box }
  body { color-scheme: dark; background: #101722; color: #edf2fa; font: 16px system-ui; margin: 0 }
  main { max-width: 880px; margin: auto; padding: 20px }
  form, article { background: #192536; border-radius: 6px; padding: 16px }
  .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,230px),1fr)); gap: 12px }
  label { display: block }
  input, select, button { font: inherit; padding: 9px; border-radius: 4px; border: 1px solid #50617a }
  label > input:not([type=checkbox]) { display: block; width: 100%; margin-top: 4px }
  .actions { display: flex; gap: 8px; margin-top: 16px }
  button { cursor: pointer; min-height: 44px }
  button[type=submit] { background: #2465a9; color: white }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid #35465a }
  .row span { flex: 1 1 220px; overflow-wrap: anywhere }
  .row input[type=text] { flex: 1 1 220px; min-width: 0 }
  .row input[type=number] { width: 90px }
  #message { color: #ffd593 }
</style>
<main>
  <h1>ARO HMI Generator</h1>
  <p id="message" role="status"></p>
  <form id="machine">
    <h2>1 / 3 · Maschine und DB</h2>
    <div class="grid">
      <label>Kunde<input name="Kunde"></label>
      <label>Maschinentyp<input name="Maschinentyp"></label>
      <label>Seriennummer<input name="Seriennummer"></label>
      <label>Herstellungsdatum<input name="Herstellungsdatum" type="date"></label>
      <label>Elektroschema<input name="Elektroschema"></label>
      <label>Softwareversion<input name="Softwareversion"></label>
      <label>Steuerung<input name="Steuerung" value="S7-1200 G2"></label>
      <label>CPU-Adresse<input id="cpu" value="192.168.10.210" required></label>
      <label>DB-Name<input id="db" value="DB_HMI" required></label>
      <label>Siemens-Export<input id="xlsx" type="file" accept=".xlsx" required></label>
    </div>
    <div class="actions"><button type="submit">Weiter</button></div>
  </form>
  <form id="access" hidden>
    <h2>2 / 3 · Variablen</h2>
    <div id="variables"></div>
    <div class="actions"><button type="button" data-back="machine">Zurück</button><button type="submit">Weiter</button></div>
  </form>
  <form id="faults" hidden>
    <h2>3 / 3 · Fehlermeldungen</h2>
    <label>BOOL-Array im DB, Index 1–96<input id="alarmArray" value="aStoOu" required></label>
    <h3>Standardmeldungen 1–80</h3>
    <div id="standard"></div>
    <h3>Zusätzliche Meldungen 81–96</h3>
    <div id="extra"></div>
    <div class="actions"><button type="button" data-back="access">Zurück</button><button type="submit">Generieren</button></div>
  </form>
</main>
<script>
const alarmNames = ["Vliesende erreicht","Laufzeit Vliesantrieb überschritten","Sensor Bandvorschub verschmutzt","Vliesantrieb überlastet / blockiert","Vliesende Vorwarnung","Vliesantrieb schwergängig","Reserve","Reserve","Filteranlage nicht betriebsbereit","Not-Aus Filteranlage betätigt","Störung Frequenzumrichter FU1","Störung Frequenzumrichter FU2","FU1 Überlast","FU2 Überlast","Motorschutz Versorgungspumpe ausgelöst","Störung Frequenzumrichter FU3","Störung Kühlgerät","Motorschutz ausgelöst","Druckluft fehlt","Pumpe gesperrt","Versorgungspumpe gesperrt","Standby aktiv","Warnung Druck Feinfilter 1 hoch","Warnung Druck Feinfilter 2 hoch","Feinfilter verschmutzt","Feinfilter 1 verschmutzt","Feinfilter 2 verschmutzt","Feinfilter 3 verschmutzt","Filter A voll","Filter B voll","Filter A und B voll","Reserve","Vlieswechsel aktiv","Störung Abstreifer HLF-B3/B4","Störung Auswerfer aussen HLF-B3","Störung Auswerfer innen HLF-B4","Störung Paddelantrieb HLF-B1/M2","Überlast Paddelantrieb HLF-M2","Reserve","HLF gesperrt","Warnung Überlast Paddelantrieb HLF-M2","Reserve","Reserve","Reserve","Störung Frequenzumrichter Hebepumpe","FU Hebepumpe Überlast","Hebepumpe gesperrt","Hebetank Leckage","Motorschutz Hebepumpe ausgelöst","Hebetank Hochalarm","Niveausensor Hebetank Störung / Parametrierfehler","Hebetank Niveau hoch","Reserve","Reserve","Filtertank Leckage","Filtertank Niveau zu hoch","Filtertank Niveau zu tief","Niveausensor Filtertank falsche Schaltlogik","Filtertank Niveau hoch","Filtertank Niveau tief","Reserve","Reserve","Reintank Leckage","Reintank Niveau zu hoch","Reintank Niveau zu tief","Niveausensor Reintank falsche Schaltlogik","Reintank Niveau hoch","Reintank Niveau tief","Not-Aus Reintank","Reserve","Druck zu hoch","Druck zu tief","Beide Tanks leer","Beide Tanks voll","Drucksensor Störung","Verriegelung nicht geschlossen","Not-Aus von WZM","Schutztür offen","Stop sofort von WZM","Werkzeugmaschine nicht bereit","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung","Erweiterung"];
const $ = id => document.getElementById(id);
const text = (parent, tag, value = '') => {
    const node = document.createElement(tag);
    node.textContent = value;
    parent.append(node);
    return node;
};
function show(page) {
    for (const form of document.forms) form.hidden = form.id !== page;
    $('message').textContent = '';
    window.scrollTo(0, 0);
}
for (const button of document.querySelectorAll('[data-back]')) button.onclick = () => show(button.dataset.back);

async function readWorkbook(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const zip = new DataView(bytes.buffer);
    const u16 = i => zip.getUint16(i, true);
    const u32 = i => zip.getUint32(i, true);
    let end = bytes.length - 22;
    while (end >= Math.max(0, bytes.length - 65557) && u32(end) !== 0x06054b50) end--;
    if (end < Math.max(0, bytes.length - 65557)) throw Error('Ungültige XLSX-Datei.');
    const files = new Map();
    const decoder = new TextDecoder();
    for (let i = 0, pos = u32(end + 16); i < u16(end + 10); i++) {
        const name = decoder.decode(bytes.subarray(pos + 46, pos + 46 + u16(pos + 28)));
        files.set(name, { method: u16(pos + 10), size: u32(pos + 20), offset: u32(pos + 42) });
        pos += 46 + u16(pos + 28) + u16(pos + 30) + u16(pos + 32);
    }
    async function xml(name) {
        const entry = files.get(name);
        if (!entry) return null;
        const start = entry.offset + 30 + u16(entry.offset + 26) + u16(entry.offset + 28);
        let data = bytes.subarray(start, start + entry.size);
        if (entry.method === 8) {
            const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            data = new Uint8Array(await new Response(stream).arrayBuffer());
        } else if (entry.method !== 0) throw Error('XLSX-Kompression nicht unterstützt.');
        return new DOMParser().parseFromString(decoder.decode(data), 'application/xml');
    }
    const shared = await xml('xl/sharedStrings.xml');
    const strings = Array.from(shared?.getElementsByTagName('si') || [], item =>
        Array.from(item.getElementsByTagName('t'), t => t.textContent).join(''));
    const sheets = [];
    for (const name of files.keys()) {
        if (!/^xl\/worksheets\/sheet\d+\.xml$/.test(name)) continue;
        const sheet = await xml(name);
        sheets.push(Array.from(sheet.getElementsByTagName('row'), row =>
            Object.fromEntries(Array.from(row.getElementsByTagName('c'), cell => {
                const raw = cell.getElementsByTagName('v')[0]?.textContent || '';
                const value = cell.getAttribute('t') === 's' ? strings[Number(raw)] :
                    cell.getAttribute('t') === 'inlineStr' ? cell.getElementsByTagName('is')[0]?.textContent : raw;
                return [cell.getAttribute('r').replace(/\d/g, ''), (value || '').trim()];
            }))));
    }
    return sheets;
}

const types = /^(BOOL|SINT|USINT|BYTE|INT|UINT|WORD|DINT|UDINT|DWORD|REAL|LREAL|TIME)$/;
function importVariables(sheets) {
    const variables = new Map();
    for (const rows of sheets) {
        let nameColumn, typeColumn, commentColumn;
        for (const row of rows) {
            const headers = Object.entries(row).map(([key, value]) => [key, value.toLowerCase().replace(/[\s_-]/g, '')]);
            const name = headers.find(([, value]) => /^(name|symbol|variablenname|tagname|membername)$/.test(value));
            const type = headers.find(([, value]) => /^(datentyp|datatype|type|typ)$/.test(value));
            if (name && type) {
                [nameColumn] = name;
                [typeColumn] = type;
                commentColumn = headers.find(([, value]) => /^(kommentar|comment|description|beschreibung)$/.test(value))?.[0];
                continue;
            }
            const member = row[nameColumn];
            const datatype = row[typeColumn]?.toUpperCase();
            if (member && types.test(datatype)) variables.set(member, {
                member, type: datatype, name: row[commentColumn] || member
            });
        }
    }
    if (!variables.size) throw Error('Keine unterstützten Variablen gefunden. Erwartet werden Spalten Name und Datentyp.');
    return [...variables.values()];
}

let importedFile;
let variables = [];
function renderVariables() {
    $('variables').replaceChildren();
    for (const variable of variables) {
        const row = text($('variables'), 'div');
        row.className = 'row';
        text(row, 'span', variable.member + ' · ' + variable.type);
        const name = text(row, 'input');
        name.type = 'text';
        name.value = variable.name;
        name.required = true;
        name.setAttribute('aria-label', 'Anzeigename für ' + variable.member);
        name.oninput = () => { variable.name = name.value; };
        const select = text(row, 'select');
        select.setAttribute('aria-label', 'Zugriff für ' + variable.member);
        for (const [value, label] of [['disabled', 'Ausblenden'], ['read', 'Lesen'], ['write', 'Lesen & Schreiben']]) {
            text(select, 'option', label).value = value;
        }
        select.value = variable.access;
        const preview = text(row, 'span');
        select.onchange = () => {
            variable.access = select.value;
            preview.replaceChildren();
            if (select.value !== 'read' || variable.type === 'BOOL') variable.operatingTime = false;
            if (select.value === 'disabled') return;
            if (variable.type === 'BOOL') preview.textContent = select.value === 'read' ? '● Lampe' : 'Switch';
            else if (select.value === 'read') {
                const label = text(preview, 'label');
                const checkbox = text(label, 'input');
                checkbox.type = 'checkbox';
                checkbox.checked = !!variable.operatingTime;
                checkbox.onchange = () => { variable.operatingTime = checkbox.checked; };
                label.append(document.createTextNode(' Betriebszeit'));
            } else {
                preview.textContent = 'Zahlenfeld';
            }
        };
        select.onchange();
    }
}
$('machine').onsubmit = async event => {
    event.preventDefault();
    const button = event.submitter;
    button.disabled = true;
    try {
        const file = $('xlsx').files[0];
        if (file !== importedFile) {
            const previous = new Map(variables.map(v => [v.member + ':' + v.type, v]));
            const sheets = await readWorkbook(file);
            variables = importVariables(sheets).map(v => ({
                ...v, ...previous.get(v.member + ':' + v.type),
                access: previous.get(v.member + ':' + v.type)?.access || 'read'
            }));
            for (const rows of sheets) {
                const header = rows.find(row => Object.values(row).includes('Datentyp'));
                if (!header) continue;
                const column = label => Object.keys(header).find(key => header[key] === label);
                const array = rows.find(row => /^ARRAY\s*\[\s*1\s*\.\.\s*96\s*\]\s*OF\s*BOOL$/i.test(row[column('Datentyp')]));
                if (array?.[column('Name')]) $('alarmArray').value = array[column('Name')];
            }
            importedFile = file;
            renderVariables();
        }
        show('access');
    } catch (error) { $('message').textContent = error.message; }
    finally { button.disabled = false; }
};
$('access').onsubmit = event => { event.preventDefault(); show('faults'); };

const alarms = alarmNames.map((name, i) => {
    const row = text($(i < 80 ? 'standard' : 'extra'), 'label');
    row.className = 'row';
    const enabled = text(row, 'input');
    enabled.type = 'checkbox';
    text(row, 'span', (i + 1) + ' · ' + (i < 80 ? name : 'Zusätzliche Meldung'));
    const custom = i < 80 ? null : text(row, 'input');
    if (custom) {
        custom.type = 'text';
        custom.value = name + ' ' + (i + 1);
        custom.setAttribute('aria-label', 'Meldungstext ' + (i + 1));
        enabled.onchange = () => { custom.required = enabled.checked; };
    }
    return { id: i + 1, name, enabled, custom };
});
$('faults').onsubmit = event => {
    event.preventDefault();
    const db = '"' + $('db').value.trim().replace(/^"|"$/g, '') + '".';
    const array = $('alarmArray').value.trim();
    const host = $('cpu').value.trim();
    let url;
    try {
        url = new URL('https://' + host + '/api/jsonrpc');
        if (url.host !== host || url.pathname !== '/api/jsonrpc' || url.username || url.password) throw Error();
    } catch { $('message').textContent = 'CPU-Adresse prüfen.'; return; }
    if (db === '"".' || !array || alarms.some(a => a.enabled.checked && a.custom && !a.custom.value.trim())) {
        $('message').textContent = 'DB, Array und ausgewählte Meldungstexte prüfen.';
        return;
    }
    const config = {
        api: { url: url.href },
        machine: Object.fromEntries(new FormData($('machine'))),
        variables: variables.map(({ member, name, type, access, operatingTime }) => ({
            tag: db + member, name: name.trim() || member, type, access,
            ...(access === 'read' && type !== 'BOOL' && operatingTime ? { operatingTime: true } : {})
        })),
        timestampFormat: 'raw',
        alarms: alarms.map(a => ({ id: a.id, name: a.custom?.value.trim() || a.name, enabled: a.enabled.checked,
            tag: db + array + '[' + a.id + ']' }))
    };
    const download = document.createElement('a');
    download.download = 'readwrite.json';
    download.href = URL.createObjectURL(new Blob([JSON.stringify(config, null, 2) + '\n'], { type: 'application/json' }));
    download.click();
    setTimeout(() => URL.revokeObjectURL(download.href), 1000);
    $('message').textContent = 'readwrite.json herunterladen und im HMI-Ordner ersetzen.';
    window.scrollTo(0, 0);
};
</script>
